name: Validate patched Keycloak 26.8.2 source build

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/keycloak-patched-build.yml"
      - "deploy/production/keycloak/**"
      - "deploy/production/compose.ingress.yaml"
      - "trivy-keycloak.yaml"

permissions:
  contents: read

jobs:
  patched-keycloak:
    name: Build, run and scan patched Keycloak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAVEN_OPTS: -Xms512m -Xmx4g -XX:+ExitOnOutOfMemoryError
    steps:
      - name: Checkout ORBIT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Fetch the immutable Keycloak 26.8.2 source commit
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/keycloak
          git -C /tmp/keycloak remote add origin https://github.com/keycloak/keycloak.git
          git -C /tmp/keycloak fetch --depth 1 origin e514445f9dcdabc5bdcf67cab56c1e49655de067
          git -C /tmp/keycloak checkout --detach FETCH_HEAD
          test "$(git -C /tmp/keycloak rev-parse HEAD)" = "e514445f9dcdabc5bdcf67cab56c1e49655de067"

      - name: Apply the narrowly scoped Guava BOM override
        shell: bash
        run: |
          set -euo pipefail
          git -C /tmp/keycloak apply --check "$GITHUB_WORKSPACE/deploy/production/keycloak/keycloak-26.8.2-guava-33.7.2.patch"
          git -C /tmp/keycloak apply "$GITHUB_WORKSPACE/deploy/production/keycloak/keycloak-26.8.2-guava-33.7.2.patch"

      - name: Verify Maven resolves patched Guava before building
        working-directory: /tmp/keycloak
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f quarkus/runtime/pom.xml help:effective-pom -Doutput=/tmp/keycloak-effective-pom.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/keycloak-effective-pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          matches = []
          for dep in root.findall('.//m:dependencyManagement/m:dependencies/m:dependency', ns):
              group = dep.findtext('m:groupId', default='', namespaces=ns)
              artifact = dep.findtext('m:artifactId', default='', namespaces=ns)
              version = dep.findtext('m:version', default='', namespaces=ns)
              if group == 'com.google.guava' and artifact == 'guava':
                  matches.append(version)
          if not matches or any(v != '33.7.2-jre' for v in matches):
              raise SystemExit(f'Expected only Guava 33.7.2-jre in effective dependency management; got {matches}')
          print('Effective Guava version:', matches)
          PY

      - name: Build Keycloak core and Quarkus distribution
        working-directory: /tmp/keycloak/quarkus
        shell: bash
        run: |
          set -euo pipefail
          ../mvnw -B -ntp -f ../pom.xml clean install -DskipTestsuite -DskipExamples -DskipTests
          ../mvnw -B -ntp clean install -DskipTests

      - name: Verify the generated distribution contains only patched Guava
        working-directory: /tmp/keycloak/quarkus
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find dist/target -maxdepth 1 -type f -name 'keycloak-26.8.2.tar.gz' -print -quit)"
          test -n "$archive"
          mkdir -p /tmp/keycloak-dist
          tar -xzf "$archive" -C /tmp/keycloak-dist
          mapfile -t jars < <(find /tmp/keycloak-dist/keycloak-26.8.2/lib/lib/main -maxdepth 1 -type f -name 'com.google.guava.guava-*.jar' -print)
          test "${#jars[@]}" -eq 1
          test "$(basename "${jars[0]}")" = "com.google.guava.guava-33.7.2-jre.jar"
          if find /tmp/keycloak-dist/keycloak-26.8.2 -type f -name '*guava-33.6.0*' | grep -q .; then
            echo "Vulnerable Guava 33.6.0 remains in the distribution" >&2
            exit 1
          fi
          echo "Patched distribution jar: ${jars[0]}"
          mkdir -p "$GITHUB_WORKSPACE/.keycloak-patched-context"
          cp -a /tmp/keycloak-dist/keycloak-26.8.2 "$GITHUB_WORKSPACE/.keycloak-patched-context/"

      - name: Build an isolated candidate image from the patched distribution
        shell: bash
        run: |
          set -euo pipefail
          cat > .keycloak-patched-context/Dockerfile <<'DOCKERFILE'
          FROM quay.io/keycloak/keycloak:26.8.2
          USER 0
          COPY --chown=1000:0 keycloak-26.8.2/ /opt/keycloak/
          USER 1000
          DOCKERFILE
          docker build --pull -t orbit-keycloak:26.8.2-guava-33.7.2 .keycloak-patched-context
          docker run --rm --entrypoint /bin/sh orbit-keycloak:26.8.2-guava-33.7.2 -ec '
            test -f /opt/keycloak/lib/lib/main/com.google.guava.guava-33.7.2-jre.jar
            test ! -f /opt/keycloak/lib/lib/main/com.google.guava.guava-33.6.0-jre.jar
          '

      - name: Start patched Keycloak and verify readiness plus OIDC discovery
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker logs keycloak-patched 2>/dev/null || true; docker rm -f keycloak-patched >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name keycloak-patched -p 8080:8080 -p 9000:9000 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=ci-admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=ci-placeholder-password \
            -e KC_HEALTH_ENABLED=true -e KC_METRICS_ENABLED=true \
            -e KC_HTTP_ENABLED=true -e KC_HOSTNAME_STRICT=false \
            orbit-keycloak:26.8.2-guava-33.7.2 start-dev --http-port=8080
          ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:9000/health/ready >/tmp/keycloak-ready.json; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          curl --fail --silent http://127.0.0.1:8080/realms/master/.well-known/openid-configuration > /tmp/keycloak-oidc.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/keycloak-oidc.json'))
          assert d.get('issuer', '').endswith('/realms/master'), d.get('issuer')
          print('OIDC discovery issuer:', d['issuer'])
          PY

      - name: Scan patched candidate image and confirm Guava finding is gone
        shell: bash
        run: |
          set -euo pipefail
          trivy image --config trivy-keycloak.yaml --pkg-types os,library --severity HIGH,CRITICAL --ignore-unfixed=false --exit-code 0 --format json --output /tmp/patched-keycloak-scan.json orbit-keycloak:26.8.2-guava-33.7.2
          python3 - <<'PY'
          import json
          report=json.load(open('/tmp/patched-keycloak-scan.json'))
          findings=[v for result in report.get('Results') or [] for v in result.get('Vulnerabilities') or []]
          guava=[v for v in findings if v.get('VulnerabilityID') == 'CVE-2026-102554']
          fts5=[v for v in findings if v.get('VulnerabilityID') == 'CVE-2026-119373']
          if guava:
              raise SystemExit('Guava CVE-2026-102554 remains: '+repr(guava))
          if not fts5:
              raise SystemExit('Expected unresolved SQLite FTS5 finding was not present; review scan configuration before proceeding')
          print('PASS: Guava CVE is absent; SQLite FTS5 remains visible and blocking.')
          PY